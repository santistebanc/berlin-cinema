name: Scrape & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/movies.json'
      - 'public/audit/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip scraping — deploy current movies.json as-is'
        type: boolean
        default: false
      force_enrich:
        description: 'Force re-fetch all data (bypass TMDb and OSM caches)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Initialize audit baseline if needed
        run: npm run audit:seed

      - name: Scrape movies
        id: scrape
        if: ${{ !inputs.skip_scrape }}
        run: npx ts-node --project tsconfig.server.json scripts/scrape.ts ${{ inputs.force_enrich && '--force-enrich' || '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          DECISION_PROVIDER: ${{ vars.DECISION_PROVIDER || 'cloudflare' }}
          DECISION_MODEL: ${{ vars.DECISION_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DECISION_MONTHLY_USD_LIMIT: '8'
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE || 'live' }}

      - name: Build
        run: npm run build
        env:
          VITE_BUILD_TIME: ${{ github.run_id }}

      - name: SPA routing fallback
        run: cp dist/index.html dist/404.html

      - name: Commit scrape artifacts
        if: ${{ !inputs.skip_scrape }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/movies.json public/sitemap.xml public/audit pipeline/state.json
          git diff --cached --quiet || git commit -m "chore(cache): update scrape data [skip ci]"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
